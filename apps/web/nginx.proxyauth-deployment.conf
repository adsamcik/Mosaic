# CANDIDATE-ONLY ProxyAuth deployment configuration.
#
# The matching Compose topology gives Caddy the fixed edge-network address
# 172.31.0.5. Nginx accepts application traffic only from that exact peer.
# Caddy must delete all client-supplied Remote-* identity headers before
# authentication and copy only Authelia's Remote-User response. Stable release
# remains blocked until the real ProxyAuth boundary evidence is approved.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $loggable_uri $server_protocol" '
                    '$status $body_bytes_sent '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Redact share-link IDs and album IDs from access logs. The link ID is
    # half of the bearer credential to a shared album (the other half lives
    # only in the URL fragment, which never reaches the server, but writing
    # link IDs to disk creates an unnecessary correlation surface for anyone
    # with log access).
    map $uri $loggable_uri {
        ~*^/api/v1/s/[^/]+/shards/   "/api/v1/s/<redacted>/shards/<redacted>";
        ~*^/api/v1/s/                "/api/v1/s/<redacted>";
        ~*^/api/v1/albums/[^/]+      "/api/v1/albums/<redacted>";
        ~*^/api/v1/manifests/[^/]+   "/api/v1/manifests/<redacted>";
        ~*^/api/v1/shards/[^/]+      "/api/v1/shards/<redacted>";
        ~*^/api/v1/share-links/[^/]+ "/api/v1/share-links/<redacted>";
        ~*^/api/v1/files/[^/]+       "/api/v1/files/<redacted>";
        ~*^/api/v1/tiles/             "/api/v1/tiles/<redacted>";
        ~*^/api/v1/shared/[^/]+      "/api/v1/shared/<redacted>";
        ~*^/api/v1/users/             "/api/v1/users/<redacted>";
        ~*^/api/v1/auth/sessions/     "/api/v1/auth/sessions/<redacted>";
        ~*^/api/v1/admin/users/       "/api/v1/admin/users/<redacted>";
        ~*^/api/v1/admin/albums/      "/api/v1/admin/albums/<redacted>";
        ~*^/api/v1/sidecar/signal/    "/api/v1/sidecar/signal/<redacted>";
        ~*^/api/v1/sidecar/close/     "/api/v1/sidecar/close/<redacted>";
        ~*^/api/s/[^/]+/shards/      "/api/s/<redacted>/shards/<redacted>";
        ~*^/api/s/                   "/api/s/<redacted>";
        ~*^/s/                       "/s/<redacted>";
        ~*^/api/albums/[^/]+         "/api/albums/<redacted>";
        ~*^/api/manifests/[^/]+      "/api/manifests/<redacted>";
        ~*^/api/shards/[^/]+         "/api/shards/<redacted>";
        ~*^/api/share-links/[^/]+    "/api/share-links/<redacted>";
        default                     $uri;
    }

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/wasm;

    server_tokens off;

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # The only network peer allowed to reach the frontend is the Caddy
        # authentication boundary at its fixed address on the edge network.
        # The health location below has its own, narrower loopback exception.
        allow 172.31.0.5;
        deny all;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Mosaic is an authenticated-only product; no surface should be
        # crawled or indexed by search engines or social-preview bots.
        # In particular, /s/<linkId> paths must NEVER appear in search
        # results or messenger-app preview cards (the URL fragment k=...
        # never reaches the server, but the existence of the link does).
        add_header X-Robots-Tag "noindex, nofollow" always;

        # HSTS - enforce HTTPS for 1 year (only effective when served over HTTPS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Content Security Policy - restrict script/style sources
        #
        # Justified relaxations (audited; do not remove without re-evaluation):
        #   General unsafe-eval is intentionally absent; the production build requires WebAssembly.
        #   'wasm-unsafe-eval'   - allow the libsodium WebAssembly module to compile.
        #   'unsafe-inline' (style-src) - inline styles emitted by third-party widgets
        #                          (e.g. Leaflet/OSM controls) and Vite-generated
        #                          critical-path style attributes. We have no nonce
        #                          plumbing for runtime-rendered styles yet.
        #
        # Hardening directives (H6):
        #   frame-ancestors 'none'        - Mosaic is never meant to be framed.
        #   object-src 'none'             - explicit block of <embed>/<object>/<applet>.
        #   base-uri 'self'               - prevent <base> hijacking via injected markup.
        #   form-action 'self'            - bound form submission targets to same origin.
        #   upgrade-insecure-requests     - block sub-resource downgrade to http://.
        #
        # img-src includes OpenStreetMap tile servers for the map view.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; font-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

        # Required headers for SharedArrayBuffer (crypto operations)
        # Using 'credentialless' to allow cross-origin resources like OpenStreetMap tiles
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;

        # Restrict browser features
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # Re-add ALL security headers (add_header in location block overrides parent)
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; font-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "credentialless" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        }

        # SPA fallback - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to backend
        # ^~ prevents asset-extension regexes from intercepting API paths such
        # as /api/v1/tiles/...png.
        location ^~ /api/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Caddy is Internet-facing and regenerates X-Forwarded-For while
            # ignoring the browser's value. Pass that single client address
            # unchanged so ASP.NET's one-hop ForwardLimit resolves the client,
            # rather than appending Caddy and collapsing rate limits onto it.
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            # This candidate listener is reachable only through Caddy's
            # automatic-HTTPS site. Do not downgrade the outer scheme to the
            # cleartext Caddy-to-Nginx hop.
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;

            # Caddy is the exact network peer allowed above. It removes all
            # incoming Remote-* headers, authenticates protected requests, and
            # overwrites Remote-User from Authelia before reaching this hop.
            proxy_set_header Remote-User $http_remote_user;
            proxy_set_header Remote-Groups "";
            proxy_set_header Remote-Email "";
            proxy_set_header Remote-Name "";

            # Tus upload support - disable buffering for large uploads
            proxy_request_buffering off;
            proxy_buffering off;
            client_max_body_size 10m;
        }

        # Health check endpoint
        location = /health {
            # Permit only the image's in-container health check and the same
            # exact Caddy peer. Loopback is not allowed into any other route.
            allow 127.0.0.1;
            allow ::1;
            allow 172.31.0.5;
            deny all;
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
