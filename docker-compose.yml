# Mosaic - Zero-Knowledge Encrypted Photo Gallery
# Docker Compose deployment configuration

name: mosaic

services:
  # PostgreSQL database
  postgres:
    # Multi-architecture OCI index for postgres:17-alpine, pinned so a
    # deployment cannot silently pick up a different database image.
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: mosaic-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}
    environment:
      POSTGRES_DB: mosaic
      POSTGRES_USER: mosaic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mosaic-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosaic -d mosaic"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Cap json-file logs at ~30 MB per service to keep long-running deploys
    # from filling disk with backend chatter / postgres slow-query traces.
    # Override with LOG_MAX_SIZE / LOG_MAX_FILE in .env if needed.
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  # .NET Backend API
  backend:
    build:
      context: .
      dockerfile: apps/backend/Mosaic.Backend/Dockerfile
    container_name: mosaic-backend
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${BACKEND_PIDS_LIMIT:-256}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    cpus: ${BACKEND_CPU_LIMIT:-2.0}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RUN_MIGRATIONS: "false"
      ConnectionStrings__Default: "Host=postgres;Database=mosaic;Username=mosaic;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      Storage__Path: /app/data/blobs
      Audit__LogPath: /app/data/audit/audit-.log
      Auth__LocalAuthEnabled: "${LOCAL_AUTH_ENABLED:-true}"
      Auth__ProxyAuthEnabled: "${PROXY_AUTH_ENABLED:-false}"
      Auth__ServerSecret: "${AUTH_SERVER_SECRET:?AUTH_SERVER_SECRET must be set; generate with: openssl rand -base64 32}"
      Auth__TrustedProxies__0: "127.0.0.1/32"
      Auth__TrustedProxies__1: "::1/128"
      Quota__DefaultMaxBytes: ${DEFAULT_QUOTA_BYTES:-10737418240}
    volumes:
      - blob_data:/app/data/blobs
      - audit_data:/app/data/audit
    networks:
      - mosaic-internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Explicit production opt-in signal. Mirrors publish.yml / build.yml.
        # The vite.config.ts redirect plugin REJECTS VITE_E2E_WEAK_KEYS=true when
        # MOSAIC_PRODUCTION_BUILD=1 is set, preventing weak-kdf WASM substitution
        # in production images. docker-compose.test.yml intentionally omits this
        # so the E2E build target can still substitute the weak-kdf WASM.
        MOSAIC_PRODUCTION_BUILD: "1"
    container_name: mosaic-frontend
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${FRONTEND_PIDS_LIMIT:-128}
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${FRONTEND_CPU_LIMIT:-1.0}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=1001,gid=1001,mode=0755
      - /var/log/nginx:rw,noexec,nosuid,size=16m,uid=1001,gid=1001,mode=0755
      - /var/run:rw,noexec,nosuid,size=4m,uid=1001,gid=1001,mode=0755
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - mosaic-internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

volumes:
  postgres_data:
    name: mosaic_postgres_data
    driver: local
  blob_data:
    driver: local
    name: mosaic_blob_data
  audit_data:
    driver: local
    name: mosaic_audit_data

networks:
  mosaic-internal:
    driver: bridge
